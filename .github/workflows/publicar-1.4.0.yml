name: Publicar pacote NEXORA 1.4.0
on:
  push:
    paths:
      - '.github/workflows/publicar-1.4.0.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remontar e validar pacote
        shell: bash
        run: |
          mkdir -p releases
          cat staging/1.4.0/part-*.b64 | base64 --decode > releases/NEXORA-PDV-1.4.0.nexora
          echo "b4ea2588ee8e33cc95ae1d17d68ef69774115c7034ed7e16b093b735a08911ef  releases/NEXORA-PDV-1.4.0.nexora" | sha256sum --check
          unzip -t releases/NEXORA-PDV-1.4.0.nexora
      - name: Publicar arquivo
        run: |
          git config user.name "NEXORA Publisher"
          git config user.email "actions@users.noreply.github.com"
          git add releases/NEXORA-PDV-1.4.0.nexora
          git commit -m "Publicar pacote compilado e assinado 1.4.0"
          git push
